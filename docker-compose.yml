services:
  browsefleet:
    build: .
    env_file: .env
    ports:
      - '3000:3000'
    environment:
      - DATA_DIR=/data
      - CDP_EXTERNAL_HOST=localhost
      - CDP_EXTERNAL_PORT=3000
      - CDP_EXTERNAL_SCHEME=ws
    volumes:
      - browsefleet-data:/data
      # Cache CloakBrowser binary across rebuilds
      - cloakbrowser-cache:/home/node/.cloakbrowser
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          memory: 8G
    restart: unless-stopped

volumes:
  browsefleet-data:
  cloakbrowser-cache:
